[project]
name = "pyminion"
version = "0.6.0"
description = "Dominion but make it python"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan Slack", email = "evan.slack@outlook.com" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/evanofslack/pyminion"
Issues = "https://github.com/evanofslack/pyminion/issues"

[dependency-groups]
dev = ["pytest", "mypy", "ruff"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
